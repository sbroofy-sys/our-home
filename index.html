<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f4ef"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Наш дом"><link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="stylesheet" href="style.css"><title>Наш дом</title></head><body>
<main><header class="top"><div class="brand"><img src="icon-192.png" alt=""><div><small>СЕМЕЙНОЕ ПРОСТРАНСТВО</small><h1>Наш дом<span>.</span></h1></div></div><button id="logout" class="quiet" hidden>Выйти</button></header>
<section id="login" class="panel login"><span class="eyebrow">ДОБРО ПОЖАЛОВАТЬ</span><h2>Всё дома<br>под контролем.</h2><p>Войдите в свой семейный аккаунт, чтобы открыть общие запасы и покупки.</p><form id="loginForm"><label>Электронная почта<input type="email" id="email" autocomplete="username" required></label><label>Пароль<input type="password" id="password" autocomplete="current-password" required></label><button class="primary" id="signIn">Войти</button></form><p class="muted" id="loginMsg" role="status">Подключаемся…</p></section>
<section id="app" hidden><div class="intro"><div><span class="eyebrow" id="sync">ПОДКЛЮЧЕНИЕ</span><h2 id="pageTitle">Домашние запасы</h2><p id="pageDesc">Проверяйте остатки и пополняйте вовремя.</p></div><button id="add" class="primary small">＋ Товар</button></div>
<div class="stats"><button data-view="stock" data-filter="all"><span>В каталоге</span><b id="total">—</b></button><button data-view="buy" data-filter="all"><span>К покупкам</span><b id="low">—</b></button><button data-view="stock" data-filter="unknown"><span>Проверить</span><b id="unknown">—</b></button></div>
<div id="tools"><div class="controls"><input id="search" type="search" placeholder="Поиск товаров…" aria-label="Поиск"><select id="category" aria-label="Категория"><option value="all">Все категории</option></select></div><div class="controls filters" id="filters"><button data-filter="all" class="chosen">Все</button><button data-filter="unknown">Не проверено</button><button data-filter="low">Заканчивается</button><button data-filter="ok">В запасе</button><button data-filter="inactive">Не используем</button></div></div>
<div id="extra" hidden><button id="copy" class="quiet">Копировать список покупок</button><button id="oneOff" class="primary small">＋ Разовая покупка</button></div>
<div id="message" role="status"></div><div id="list" aria-live="polite"></div>
<nav class="nav" aria-label="Разделы"><button data-view="stock" class="chosen"><span>▦</span>Запасы</button><button data-view="buy"><span>✓</span>Покупки</button><button data-view="history"><span>◷</span>История</button></nav></section>
</main><dialog id="editor"><form id="editForm"><div class="dialogHead"><h2 id="editTitle">Товар</h2><button type="button" id="close" class="quiet">✕</button></div><label>Название<input id="name" required maxlength="100"></label><label>Категория<input id="editCat" list="categories" required maxlength="60"><datalist id="categories"></datalist></label><div class="fields"><label>Остаток<input id="qty" type="number" min="0" step="any" placeholder="Не проверено"></label><label>Ед. изм.<input id="unit" required maxlength="15" placeholder="шт."></label><label>Норма<input id="norm" type="number" min="0.001" step="any" required></label><label>Минимум<input id="min" type="number" min="0" step="any" required></label></div><label>Заметка / марка<input id="note" maxlength="240"></label><label class="check"><input type="checkbox" id="active" checked> Используем этот товар</label><div class="dialogHead"><button type="button" id="remove" class="danger">Удалить</button><button class="primary" id="save">Сохранить</button></div><p id="editMsg" role="status" class="muted"></p></form></dialog>
<script type="module" src="app.js"></script></body></html>
